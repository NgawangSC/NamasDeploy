<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="NAMAS Architecture - Innovative architectural designs for modern living" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NAMAS Architecture</title>
    
    <!-- Fallback styles for critical components -->
    <style>
      /* Fallback styles for experience box to ensure visibility */
      .experience-box-container {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 100% !important;
        min-height: 300px !important;
      }
      
      .experience-box {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 400px !important;
        height: 500px !important;
        background: white !important;
        position: relative !important;
        z-index: 10 !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
        /* Fallback border in case border-image fails */
        border: 30px solid #8B4513 !important;
        /* Use background-image as fallback for border-image */
        background-clip: padding-box !important;
      }
      
      /* Ensure the content is always visible */
      .experience-content {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        padding: 40px 30px !important;
        width: 100% !important;
        height: 100% !important;
        color: #333 !important;
        background: rgba(255, 255, 255, 0.95) !important;
      }
      
      .experience-years {
        font-size: 120px !important;
        font-weight: bold !important;
        line-height: 1 !important;
        margin-bottom: 20px !important;
        color: #8B4513 !important;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1) !important;
      }
      
      .experience-label {
        font-size: 24px !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        letter-spacing: 2px !important;
        color: #333 !important;
      }
      
      /* Ensure experience box is not replaced by image */
      .experience-box img {
        display: none !important;
      }
      
      /* Mobile responsive fallback */
      @media (max-width: 768px) {
        .experience-box {
          width: 280px !important;
          height: 220px !important;
          border: 20px solid #8B4513 !important;
        }
        
        .experience-years {
          font-size: 80px !important;
          margin-bottom: 15px !important;
        }
        
        .experience-label {
          font-size: 18px !important;
        }
      }
      
      @media (max-width: 480px) {
        .experience-box {
          width: 250px !important;
          height: 200px !important;
          border: 15px solid #8B4513 !important;
        }
        
        .experience-years {
          font-size: 60px !important;
          margin-bottom: 10px !important;
        }
        
        .experience-label {
          font-size: 16px !important;
        }
      }
    </style>
    
    <!-- Experience Box Fallback Script -->
    <script>
      // Ensure experience box displays properly after page load
      document.addEventListener('DOMContentLoaded', function() {
        // Wait for React to render
        setTimeout(function() {
          checkAndFixExperienceBox();
        }, 500);
      });
      
      // Check again after a longer delay to handle async content loading
      window.addEventListener('load', function() {
        setTimeout(function() {
          checkAndFixExperienceBox();
        }, 1000);
      });
      
      function checkAndFixExperienceBox() {
        const experienceContainer = document.querySelector('.experience-box-container');
        if (experienceContainer) {
          const experienceBox = experienceContainer.querySelector('.experience-box');
          
          if (experienceBox) {
            // Check if the experience box only contains an image or is empty
            const hasContent = experienceBox.querySelector('.experience-content');
            const hasOnlyImage = experienceBox.querySelector('img') && !hasContent;
            const isEmpty = experienceBox.children.length === 0;
            
            if (hasOnlyImage || isEmpty) {
              console.log('Experience box issue detected, applying fix...');
              
              // Clear any problematic content
              experienceBox.innerHTML = '';
              
              // Create the proper content structure
              const contentDiv = document.createElement('div');
              contentDiv.className = 'experience-content';
              
              const yearsDiv = document.createElement('div');
              yearsDiv.className = 'experience-years';
              yearsDiv.textContent = '10+';
              
              const labelDiv = document.createElement('div');
              labelDiv.className = 'experience-label';
              labelDiv.textContent = 'YEARS OF EXPERIENCE';
              
              contentDiv.appendChild(yearsDiv);
              contentDiv.appendChild(labelDiv);
              experienceBox.appendChild(contentDiv);
              
              console.log('Experience box content restored successfully');
            }
          } else {
            // If experience box doesn't exist, create it
            console.log('Experience box missing, creating fallback...');
            createFallbackExperienceBox(experienceContainer);
          }
        }
      }
      
      function createFallbackExperienceBox(container) {
        const experienceBox = document.createElement('div');
        experienceBox.className = 'experience-box';
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'experience-content';
        
        const yearsDiv = document.createElement('div');
        yearsDiv.className = 'experience-years';
        yearsDiv.textContent = '10+';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'experience-label';
        labelDiv.textContent = 'YEARS OF EXPERIENCE';
        
        contentDiv.appendChild(yearsDiv);
        contentDiv.appendChild(labelDiv);
        experienceBox.appendChild(contentDiv);
        container.appendChild(experienceBox);
        
        console.log('Fallback experience box created successfully');
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
