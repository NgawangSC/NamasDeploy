<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="NAMAS Architecture - Innovative architectural designs for modern living" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NAMAS Architecture</title>
    
    <!-- Fallback styles for critical components -->
    <style>
      /* Fallback styles for experience box to ensure visibility */
      .experience-box-container {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 100% !important;
      }
      
      .experience-box {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 400px !important;
        height: 500px !important;
        background: white !important;
        border: 30px solid #ddd !important;
        border-radius: 0 !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
        position: relative !important;
        z-index: 10 !important;
        transition: all 0.3s ease !important;
      }
      
      .experience-content {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        text-align: center !important;
        padding: 40px 30px !important;
      }
      
      .experience-content h4 {
        font-size: 20rem !important;
        font-weight: 700 !important;
        margin: 0 0 15px 0 !important;
        line-height: 1 !important;
        color: #333 !important;
      }
      
      .experience-content p {
        font-size: 1rem !important;
        margin: 0 !important;
        line-height: 1.4 !important;
        font-weight: 600 !important;
        text-transform: uppercase !important;
        letter-spacing: 1px !important;
        color: #333 !important;
      }
      
      @media (max-width: 768px) {
        .experience-box {
          width: 280px !important;
          height: 220px !important;
          border: 20px solid #ddd !important;
        }
        
        .experience-content {
          padding: 30px 20px !important;
        }
        
        .experience-content h4 {
          font-size: 3rem !important;
          margin: 0 0 10px 0 !important;
        }
        
        .experience-content p {
          font-size: 0.9rem !important;
        }
      }
      
      @media (max-width: 480px) {
        .experience-box {
          width: 250px !important;
          height: 200px !important;
          border: 15px solid #ddd !important;
        }
        
        .experience-content {
          padding: 25px 15px !important;
        }
        
        .experience-content h4 {
          font-size: 2.5rem !important;
        }
        
        .experience-content p {
          font-size: 0.8rem !important;
          letter-spacing: 0.5px !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
